version: '3.8'
services:
  frontend:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - splash-net

  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    networks:
      - splash-net

networks:
  splash-net:
    driver: bridge